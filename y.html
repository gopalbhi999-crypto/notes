<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyTube</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#0f0f0f;
  color:white;
}

.header{
  height:65px;
  background:#181818;
  display:flex;
  align-items:center;
  gap:20px;
  padding:0 20px;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:22px;
  font-weight:bold;
  color:#ff0000;
  white-space:nowrap;
}

.search{
  flex:1;
  max-width:650px;
  display:flex;
}

.search input{
  width:100%;
  padding:12px 18px;
  background:#121212;
  border:1px solid #444;
  color:white;
  border-radius:25px 0 0 25px;
  outline:none;
}

.search button{
  width:60px;
  border:0;
  background:#303030;
  color:white;
  border-radius:0 25px 25px 0;
  cursor:pointer;
  font-size:18px;
}

.home{
  padding:25px;
}

.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  margin-bottom:25px;
}

.categories button{
  background:#272727;
  color:white;
  border:0;
  padding:10px 18px;
  border-radius:20px;
  cursor:pointer;
  white-space:nowrap;
}

.categories button:hover{
  background:#444;
}

.videos{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:25px;
}

.card{
  cursor:pointer;
}

.thumbnail{
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
  border-radius:12px;
  background:#222;
}

.title{
  font-size:16px;
  font-weight:bold;
  margin-top:10px;
}

.channel{
  color:#aaa;
  font-size:14px;
  margin-top:7px;
}

.player{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.95);
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.player-content{
  width:95%;
  max-width:1000px;
}

.video{
  width:100%;
  aspect-ratio:16/9;
  border:0;
  border-radius:12px;
}

.close{
  float:right;
  background:#ff0000;
  border:0;
  color:white;
  padding:10px 18px;
  border-radius:8px;
  margin-bottom:10px;
  cursor:pointer;
}

.no-result{
  color:#aaa;
  text-align:center;
  padding:50px;
}
</style>
</head>

<body>

<header class="header">

  <div class="logo">
    ▶ MyTube
  </div>

  <div class="search">
    <input
      id="searchInput"
      type="text"
      placeholder="Search videos..."
      onkeydown="if(event.key==='Enter') searchVideos()"
    >

    <button onclick="searchVideos()">🔍</button>
  </div>

</header>


<main class="home">

  <div class="categories">
    <button onclick="filterVideos('all')">All</button>
    <button onclick="filterVideos('music')">Music</button>
    <button onclick="filterVideos('gaming')">Gaming</button>
    <button onclick="filterVideos('news')">News</button>
    <button onclick="filterVideos('tech')">Technology</button>
  </div>


  <div class="videos" id="videos"></div>

</main>


<!-- IN-APP VIDEO PLAYER -->

<div class="player" id="player">

  <div class="player-content">

    <button class="close" onclick="closePlayer()">
      ✕ Close
    </button>

    <iframe
      id="videoFrame"
      class="video"
      src=""
      allow="autoplay; encrypted-media; picture-in-picture"
      allowfullscreen>
    </iframe>

  </div>

</div>


<script>

const videos = [

  {
    title:"Never Gonna Give You Up",
    channel:"Rick Astley",
    category:"music",
    id:"dQw4w9WgXcQ"
  },

  {
    title:"YouTube Official Video",
    channel:"YouTube",
    category:"tech",
    id:"jNQXAC9IVRw"
  },

  {
    title:"Amazing Music Video",
    channel:"Music Channel",
    category:"music",
    id:"kJQP7kiw5Fk"
  },

  {
    title:"Technology Explained",
    channel:"Tech Channel",
    category:"tech",
    id:"aircAruvnKk"
  },

  {
    title:"Gaming Highlights",
    channel:"Gaming Channel",
    category:"gaming",
    id:"M7lc1UVf-VE"
  }

];


const videoContainer =
  document.getElementById("videos");


function showVideos(list){

  videoContainer.innerHTML = "";

  if(list.length === 0){

    videoContainer.innerHTML =
      `<div class="no-result">
        No videos found 😕
      </div>`;

    return;
  }


  list.forEach(video => {

    const card = document.createElement("div");

    card.className = "card";

    card.innerHTML = `

      <img
        class="thumbnail"
        src="https://img.youtube.com/vi/${video.id}/hqdefault.jpg"
      >

      <div class="title">
        ${video.title}
      </div>

      <div class="channel">
        ${video.channel}
      </div>

    `;

    card.onclick = () => openVideo(video.id);

    videoContainer.appendChild(card);

  });

}


function openVideo(id){

  const player =
    document.getElementById("player");

  const frame =
    document.getElementById("videoFrame");

  frame.src =
    `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;

  player.style.display = "flex";

}


function closePlayer(){

  const player =
    document.getElementById("player");

  const frame =
    document.getElementById("videoFrame");

  frame.src = "";

  player.style.display = "none";

}


function searchVideos(){

  const query =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase();

  const results =
    videos.filter(video =>
      video.title.toLowerCase().includes(query) ||
      video.channel.toLowerCase().includes(query)
    );

  showVideos(results);

}


function filterVideos(category){

  if(category === "all"){

    showVideos(videos);
    return;

  }

  showVideos(
    videos.filter(video =>
      video.category === category
    )
  );

}


showVideos(videos);

</script>

</body>
</html>
