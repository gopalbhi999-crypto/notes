<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class 12 Maths RD Sharma Solutions</title>
  <style>
    :root {
      --primary-color: #6366f1;
      --primary-hover: #4f46e5;
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none; /* Text selection disable */
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header Styling */
    header {
      background-color: var(--card-bg);
      text-align: center;
      padding: 25px 15px;
      border-bottom: 1px solid var(--border-color);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    header h1 {
      font-size: 1.8rem;
      color: #ffffff;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Main Container */
    .container {
      max-width: 1200px;
      width: 95%;
      margin: 20px auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex: 1;
    }

    /* PDF Buttons Area */
    .pdf-selector {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .pdf-btn {
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 2px solid var(--border-color);
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pdf-btn:hover {
      border-color: var(--primary-color);
      transform: translateY(-2px);
    }

    .pdf-btn.active {
      background-color: var(--primary-color);
      border-color: var(--primary-color);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
    }

    /* PDF Viewer Container */
    .viewer-container {
      background-color: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      overflow: hidden;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      height: 78vh;
      display: flex;
      flex-direction: column;
    }

    .viewer-header {
      background-color: rgba(15, 23, 42, 0.8);
      padding: 12px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .viewer-title {
      font-weight: 600;
      color: #38bdf8;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Footer */
    footer {
      background-color: var(--card-bg);
      text-align: center;
      padding: 15px;
      border-top: 1px solid var(--border-color);
      margin-top: 20px;
    }

    footer p {
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 500;
    }

    footer span {
      color: #38bdf8;
      font-weight: 700;
      text-transform: capitalize;
    }

    @media (max-width: 768px) {
      .pdf-btn {
        width: 100%;
        justify-content: center;
      }
      .viewer-container {
        height: 68vh;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Class 12th Mathematics Study Material</h1>
    <p>Select any book below to view online page-by-page</p>
  </header>

  <div class="container">
    
    <div class="pdf-selector">
      <button class="pdf-btn active" onclick="loadDrivePDF('15jItcP52Xccz9Gl__kjwlXC', 'RD SHARMA VOLUME 1 12th', this)">
        📄 RD SHARMA VOLUME 1 12th
      </button>
      <button class="pdf-btn" onclick="loadDrivePDF('1CrUMM6-Zsi2L2_zyi8GTKhC', 'RD SHARMA VOLUME 2 12th', this)">
        📄 RD SHARMA VOLUME 2 12th
      </button>
      <button class="pdf-btn" onclick="loadDrivePDF('1euuetzBuvQ8lPvBJrK', 'MCQ RD CLASS 12th', this)">
        📝 MCQ RD CLASS 12th
      </button>
    </div>

    <div class="viewer-container">
      <div class="viewer-header">
        <span class="viewer-title" id="current-title">RD SHARMA VOLUME 1 12th</span>
        <span style="font-size: 0.85rem; color: var(--text-muted);">Online Reader Mode</span>
      </div>
      <iframe id="pdf-frame" src=""></iframe>
    </div>

  </div>

  <footer>
    <p>Provided by <span>gopal</span></p>
  </footer>

  <script>
    // Drive Preview Loader Function
    function loadDrivePDF(driveId, title, element) {
      const buttons = document.querySelectorAll('.pdf-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');

      document.getElementById('current-title').innerText = title;
      
      // Google Drive Preview URL
      const embedUrl = 'https://drive.google.com/file/d/' + driveId + '/preview';
      document.getElementById('pdf-frame').src = embedUrl;
    }

    // Default Load Vol 1
    window.onload = function() {
      const defaultBtn = document.querySelector('.pdf-btn');
      loadDrivePDF('15jItcP52Xccz9GlJEDrygGN3__kjwlXC', 'RD SHARMA VOLUME 1 12th', defaultBtn);
    };

    // Right Click aur Shortcut keys block karein security ke liye
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.onkeydown = function(e) {
      if (e.ctrlKey && (e.keyCode === 83 || e.keyCode === 80 || e.keyCode === 85)) {
        return false;
      }
    };
  </script>

</body>
</html>
