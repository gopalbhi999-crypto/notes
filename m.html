<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RD Sharma PDF Reader</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: #1a1a1a; margin-bottom: 25px; }

        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .pdf-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 200px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .pdf-card:hover { transform: translateY(-5px); }

        .pdf-icon {
            height: 220px;
            background: linear-gradient(135deg, #e63946, #b71c1c);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 30px;
            margin-bottom: 15px;
        }

        .book-title { font-weight: bold; margin-bottom: 10px; color: #333; }
        .tap-btn { background: #007bff; color: white; padding: 8px; border-radius: 6px; font-size: 13px; font-weight: bold; }

        /* Fullscreen Overlay Modal */
        .viewer-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.92);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .viewer-box {
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .viewer-header {
            background: #1a1a1a;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1002;
        }

        .action-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 14px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }

        .close-btn { background: #dc3545; }

        /* Container designed to strictly hide external scrollbars */
        .iframe-wrapper {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h1>RD Sharma Library</h1>

    <div class="container">
        <div class="pdf-card" onclick="openPdf('530968092')">
            <div class="pdf-icon">📄</div>
            <div class="book-title">RD SHARMA VOL 1</div>
            <div class="tap-btn">Read Here ➔</div>
        </div>

        <div class="pdf-card" onclick="openPdf('699757777')">
            <div class="pdf-icon">📄</div>
            <div class="book-title">RD SHARMA VOL 2</div>
            <div class="tap-btn">Read Here ➔</div>
        </div>
    </div>

    <div id="viewerModal" class="viewer-modal">
        <div id="viewerBox" class="viewer-box">
            <div class="viewer-header">
                <button class="action-btn" onclick="toggleFullScreen()">🖥 Fullscreen</button>
                <button class="action-btn close-btn" onclick="closePdf()">✖ Close</button>
            </div>
            <div class="iframe-wrapper">
                <iframe id="scribdIframe" src="" allowfullscreen="true"></iframe>
            </div>
        </div>
    </div>

    <script>
        function openPdf(docId) {
            var embedUrl = "https://www.scribd.com/embeds/" + docId + "/content";
            document.getElementById("scribdIframe").src = embedUrl;
            document.getElementById("viewerModal").style.display = "flex";
        }

        function closePdf() {
            document.getElementById("viewerModal").style.display = "none";
            document.getElementById("scribdIframe").src = "";
            if (document.fullscreenElement) {
                document.exitFullscreen();
            }
        }

        function toggleFullScreen() {
            var box = document.getElementById("viewerBox");
            if (!document.fullscreenElement) {
                box.requestFullscreen().catch(err => {
                    alert("Fullscreen not supported");
                });
            } else {
                document.exitFullscreen();
            }
        }
    </script>

</body>
</html>
