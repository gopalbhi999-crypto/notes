<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class 12 Maths RD Sharma Solutions</title>
  <style>
    :root {
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header */
    header {
      background-color: var(--card-bg);
      text-align: center;
      padding: 25px 15px;
      border-bottom: 1px solid var(--border-color);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    header h1 {
      font-size: 1.8rem;
      color: #ffffff;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Main Content Layout */
    .container {
      max-width: 1200px;
      width: 95%;
      margin: 20px auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex: 1;
    }

    /* Buttons Navigation */
    .pdf-selector {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .pdf-btn {
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 2px solid var(--border-color);
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pdf-btn:hover {
      border-color: var(--primary-color);
      transform: translateY(-2px);
    }

    .pdf-btn.active {
      background-color: var(--primary-color);
      border-color: var(--primary-color);
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
    }

    /* Viewer Container */
    .viewer-container {
      background-color: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      overflow: hidden;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      height: 75vh;
      display: flex;
      flex-direction: column;
    }

    .viewer-header {
      background-color: rgba(15, 23, 42, 0.6);
      padding: 12px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .viewer-title {
      font-weight: 600;
      color: #38bdf8;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Footer */
    footer {
      background-color: var(--card-bg);
      text-align: center;
      padding: 15px;
      border-top: 1px solid var(--border-color);
      margin-top: 20px;
    }

    footer p {
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 500;
    }

    footer span {
      color: #38bdf8;
      font-weight: 600;
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .pdf-btn {
        width: 100%;
        justify-content: center;
      }
      .viewer-container {
        height: 65vh;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Class 12th Mathematics Study Material</h1>
    <p>Select any book below to view online page-by-page</p>
  </header>

  <div class="container">
    
    <div class="pdf-selector">
      <button class="pdf-btn active" onclick="loadPDF('Vol1.pdf', 'RD SHARMA VOLUME 1 12th', this)">
        📄 RD SHARMA VOLUME 1 12th
      </button>
      <button class="pdf-btn" onclick="loadPDF('Vol2.pdf', 'RD SHARMA VOLUME 2 12th', this)">
        📄 RD SHARMA VOLUME 2 12th
      </button>
      <button class="pdf-btn" onclick="loadPDF('Mcq.pdf', 'MCQ RD CLASS 12th', this)">
        📝 MCQ RD CLASS 12th
      </button>
    </div>

    <div class="viewer-container">
      <div class="viewer-header">
        <span class="viewer-title" id="current-title">RD SHARMA VOLUME 1 12th</span>
        <span style="font-size: 0.85rem; color: var(--text-muted);">PDF.js Fast Viewer</span>
      </div>
      <iframe id="pdf-frame" src=""></iframe>
    </div>

  </div>

  <footer>
    <p>Provided by <span>gopal</span></p>
  </footer>

  <script>
    // PDF Load karne ka Function
    function loadPDF(filename, title, element) {
      // Buttons ka Active state change karein
      const buttons = document.querySelectorAll('.pdf-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');

      // Title update karein
      document.getElementById('current-title').innerText = title;

      // Full URL calculate karein
      const pdfUrl = window.location.origin + '/' + filename;
      
      // Mozilla PDF.js viewer embed (Page-by-page loading ke liye)
      const viewerUrl = 'https://mozilla.github.io/pdf.js/web/viewer.html?file=' + encodeURIComponent(pdfUrl);
      
      // Iframe ka src set karein
      document.getElementById('pdf-frame').src = viewerUrl;
    }

    // Default: Pehle se Volume 1 load rakhein
    window.onload = function() {
      const defaultBtn = document.querySelector('.pdf-btn');
      loadPDF('Vol1.pdf', 'RD SHARMA VOLUME 1 12th', defaultBtn);
    };
  </script>

</body>
</html>
