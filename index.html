<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Gopal's Personal Site</title>

    <style>

        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --border: #334155;
            --input: #0f172a;
            --shadow: rgba(0,0,0,.45);
        }

        body.light {
            --bg: #eef2ff;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #dbeafe;
            --input: #f8fafc;
            --shadow: rgba(15,23,42,.15);
        }

        body {

            margin: 0;

            padding: 20px 0 50px;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #1e3a8a 0%,
                    var(--bg) 45%
                );

            color: var(--text);

            min-height: 100vh;

            transition:
                background .3s,
                color .3s;

        }


        /* TOP BAR */

        .topbar {

            width: 92%;

            max-width: 560px;

            margin: 0 auto 15px;

            display: flex;

            justify-content: flex-end;

            gap: 8px;

        }

        .top-btn {

            width: 42px;

            height: 42px;

            border-radius: 13px;

            border: 1px solid var(--border);

            background: var(--card);

            color: var(--text);

            display: flex;

            align-items: center;

            justify-content: center;

            text-decoration: none;

            font-size: 19px;

            cursor: pointer;

            box-shadow:
                0 8px 25px var(--shadow);

        }


        /* MAIN CARD */

        .container {

            width: 92%;

            max-width: 560px;

            margin: auto;

            background: var(--card);

            padding: 30px 22px;

            border-radius: 26px;

            box-shadow:
                0 20px 60px var(--shadow);

            border:
                1px solid var(--border);

            transition:
                background .3s;

        }


        .profile-icon {

            width: 75px;

            height: 75px;

            margin: 0 auto 15px;

            border-radius: 23px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 35px;

            background:
                linear-gradient(
                    135deg,
                    #38bdf8,
                    #6366f1
                );

            box-shadow:
                0 10px 30px
                rgba(56,189,248,.25);

        }


        h1 {

            font-size: 2rem;

            margin: 0;

            text-align: center;

            background:
                linear-gradient(
                    to right,
                    #38bdf8,
                    #818cf8
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

            letter-spacing: 2px;

        }


        .author {

            color: var(--muted);

            text-align: center;

            font-size: .9rem;

            margin: 8px 0 25px;

            text-transform: uppercase;

            letter-spacing: 1px;

        }


        /* SEARCH */

        .search-box {

            margin-bottom: 18px;

        }

        .search-box input {

            width: 100%;

            padding: 14px 16px;

            border-radius: 14px;

            border: 1px solid var(--border);

            background: var(--input);

            color: var(--text);

            outline: none;

            font-size: 15px;

        }

        .search-box input:focus {

            border-color: #38bdf8;

        }


        /* BUTTONS */

        .btn-list {

            display: flex;

            flex-direction: column;

            gap: 13px;

        }


        .btn {

            padding: 15px;

            font-size: 1rem;

            font-weight: 700;

            text-decoration: none;

            color: white;

            border-radius: 14px;

            transition: .25s;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            border:
                1px solid
                rgba(255,255,255,.1);

        }


        .btn:hover {

            transform:
                translateY(-3px)
                scale(1.01);

            filter: brightness(1.1);

            box-shadow:
                0 12px 25px
                rgba(0,0,0,.25);

        }


        .btn-yt {
            background: #ef4444;
        }

        .btn-physics {
            background: #0ea5e9;
        }

        .btn-chem {
            background: #f59e0b;
        }

        .btn-maths {
            background: #10b981;
        }

        .btn-bio {
            background: #d946ef;
        }

        .btn-launcher {

            background:
                linear-gradient(
                    135deg,
                    #34c759,
                    #10b981
                );

        }

        .btn-resource {

            background:
                linear-gradient(
                    135deg,
                    #8b5cf6,
                    #6366f1
                );

        }


        /* RESOURCES */

        #resources {

            display: none;

            margin-top: 25px;

            padding-top: 22px;

            border-top:
                1px solid var(--border);

        }


        .resource-title {

            text-align: center;

            margin: 0 0 15px;

            font-size: 21px;

            color: #38bdf8;

        }


        .resource-search {

            width: 100%;

            padding: 13px;

            margin-bottom: 12px;

            border-radius: 12px;

            border: 1px solid var(--border);

            background: var(--input);

            color: var(--text);

            outline: none;

        }


        .resource-card {

            background: var(--input);

            border:
                1px solid var(--border);

            border-radius: 15px;

            padding: 15px;

            margin-top: 10px;

        }


        .resource-name {

            font-weight: 700;

            font-size: 16px;

        }


        .resource-subject {

            color: var(--muted);

            font-size: 13px;

            margin:
                5px 0 12px;

        }


        .open-pdf {

            display: block;

            width: 100%;

            padding: 11px;

            text-align: center;

            text-decoration: none;

            color: white;

            background: #2563eb;

            border-radius: 10px;

            font-weight: 700;

        }


        .no-resource {

            text-align: center;

            color: var(--muted);

            padding: 15px;

        }


        .note-text {

            margin-top: 25px;

            font-size: .85rem;

            color: var(--muted);

            line-height: 1.5;

            text-align: center;

        }


        footer {

            margin-top: 25px;

            font-size: .75rem;

            color: var(--muted);

            text-align: center;

        }


        .hidden {

            display: none !important;

        }

    </style>

</head>


<body>


    <!-- TOP BUTTONS -->

    <div class="topbar">

        <button
            class="top-btn"
            onclick="toggleTheme()"
            title="Night / Light Mode"
        >
            🌙
        </button>

        <a
            href="admin.html"
            class="top-btn"
            title="Admin"
        >
            ⚙️
        </a>

    </div>


    <!-- MAIN -->

    <div class="container">


        <div class="profile-icon">
            👨‍🎓
        </div>


        <h1>
            GOPAL SHARMA
        </h1>


        <p class="author">
            Personal Notes & Resources
        </p>


        <!-- SEARCH -->

        <div class="search-box">

            <input
                id="mainSearch"
                type="text"
                placeholder="🔍 Search resources..."
                oninput="searchMain()"
            >

        </div>


        <!-- BUTTONS -->

        <div
            class="btn-list"
            id="mainButtons"
        >

            <a
                href="y.html"
                class="btn btn-yt"
            >
                📺 YouTube
            </a>


            <a
                href="CH1%20Electric%20Charges%20and%20Fields.pdf"
                class="btn btn-physics"
                target="_blank"
            >
                ⚛️ Physics Notes
            </a>


            <a
                href="che.pdf"
                class="btn btn-chem"
                target="_blank"
            >
                🧪 Chemistry Notes
            </a>


            <a
                href="m.html"
                class="btn btn-maths"
            >
                📐 RD SHARMA
            </a>


            <a
                href="bio.pdf"
                class="btn btn-bio"
                target="_blank"
            >
                🧬 Biology PYQ
            </a>


            <!-- RESOURCES BUTTON -->

            <a
                href="javascript:void(0)"
                class="btn btn-resource"
                onclick="toggleResources()"
            >
                📚 Resources
            </a>


            <a
                href="u.html"
                class="btn btn-launcher"
            >
                📥 GLAUNCHER APK
            </a>

        </div>


        <!-- RESOURCES -->

        <div id="resources">

            <h2 class="resource-title">
                📚 Resources
            </h2>


            <input
                id="resourceSearch"
                class="resource-search"
                type="text"
                placeholder="🔍 Search PDF..."
                oninput="filterResources()"
            >


            <div id="resourceList">

                <div class="no-resource">
                    Loading resources...
                </div>

            </div>

        </div>


        <p class="note-text">
            *After Class 12, content will be provided consistently.
        </p>


        <footer>
            Created with ❤️ by Gopal
        </footer>

    </div>


<script>


    /* -------------------------
       BACKEND
    ------------------------- */

    const API =
        "https://notes-2dpl.onrender.com";


    let allResources = [];


    /* -------------------------
       NIGHT MODE
    ------------------------- */

    function toggleTheme() {

        document.body.classList.toggle(
            "light"
        );

        const isLight =
            document.body.classList.contains(
                "light"
            );

        localStorage.setItem(
            "gopal_theme",
            isLight
                ? "light"
                : "dark"
        );

    }


    /* LOAD SAVED THEME */

    if (
        localStorage.getItem(
            "gopal_theme"
        ) === "light"
    ) {

        document.body.classList.add(
            "light"
        );

    }


    /* -------------------------
       RESOURCES TOGGLE
    ------------------------- */

    function toggleResources() {

        const section =
            document.getElementById(
                "resources"
            );

        if (
            section.style.display ===
            "block"
        ) {

            section.style.display =
                "none";

            return;

        }


        section.style.display =
            "block";


        loadResources();


        setTimeout(() => {

            section.scrollIntoView({
                behavior: "smooth"
            });

        }, 100);

    }


    /* -------------------------
       LOAD RESOURCES
    ------------------------- */

    async function loadResources() {

        const list =
            document.getElementById(
                "resourceList"
            );


        list.innerHTML = `
            <div class="no-resource">
                Loading resources...
            </div>
        `;


        try {

            const response =
                await fetch(
                    API +
                    "/api/resources"
                );


            if (!response.ok) {

                throw new Error(
                    "Could not load resources."
                );

            }


            const resources =
                await response.json();


            allResources =
                resources.reverse();


            renderResources(
                allResources
            );


        } catch (error) {

            list.innerHTML = `
                <div class="no-resource">
                    ❌ Resources load nahi ho rahe.
                    <br><br>
                    Please try again.
                </div>
            `;

        }

    }


    /* -------------------------
       DISPLAY RESOURCES
    ------------------------- */

    function renderResources(
        resources
    ) {

        const list =
            document.getElementById(
                "resourceList"
            );


        if (!resources.length) {

            list.innerHTML = `
                <div class="no-resource">
                    📚 Abhi koi resource available nahi hai.
                </div>
            `;

            return;

        }


        list.innerHTML = "";


        resources.forEach(
            resource => {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "resource-card";


                card.innerHTML = `

                    <div
                        class="resource-name"
                    >
                        📄
                        ${escapeHTML(
                            resource.name
                        )}
                    </div>


                    <div
                        class="resource-subject"
                    >
                        📚
                        ${escapeHTML(
                            resource.subject
                        )}
                    </div>


                    <a
                        class="open-pdf"
                        href="${API}${resource.file}"
                        target="_blank"
                        rel="noopener"
                    >
                        👁️ OPEN PDF
                    </a>

                `;


                list.appendChild(
                    card
                );

            }
        );

    }


    /* -------------------------
       SEARCH RESOURCES
    ------------------------- */

    function filterResources() {

        const query =
            document
                .getElementById(
                    "resourceSearch"
                )
                .value
                .toLowerCase()
                .trim();


        const filtered =
            allResources.filter(
                resource => {

                    return (

                        String(
                            resource.name
                        )
                        .toLowerCase()
                        .includes(query)

                        ||

                        String(
                            resource.subject
                        )
                        .toLowerCase()
                        .includes(query)

                    );

                }
            );


        renderResources(
            filtered
        );

    }


    /* -------------------------
       MAIN SEARCH
    ------------------------- */

    function searchMain() {

        const query =
            document
                .getElementById(
                    "mainSearch"
                )
                .value
                .toLowerCase()
                .trim();


        const buttons =
            document.querySelectorAll(
                "#mainButtons .btn"
            );


        buttons.forEach(
            button => {

                const text =
                    button.textContent
                        .toLowerCase();


                if (
                    !query ||
                    text.includes(query)
                ) {

                    button.style.display =
                        "flex";

                } else {

                    button.style.display =
                        "none";

                }

            }
        );

    }


    /* -------------------------
       SECURITY
    ------------------------- */

    function escapeHTML(value) {

        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


</script>


</body>
</html>
